extends:
  - presets/tabs

tabs:
  content:
    columns:
      left:
        width: 1/3
        fields:
          cover: fields/thumbnail

          date:
            label: Date de publication
            width: 3/4
            extends: fields/date

          showDate:
            label: Afficher la date
            type: toggle
            default: on
            width: 1/4

          categories:
            label: Catégories
            type: multiselect
            # HACK populate a help when query is empty, to allow CSS targeting
            help: "{{ page.parent?.categories.isNotEmpty ? '' : 'hidden' }}"
            options:
              type: query
              query: page.parent?.categories.toStructure ?? []
              text: "{{ item.title }}"
              value: "{{ item.title.slug }}"

      right:
        width: 2/3
        fields:
          description: fields/header
          blocks: fields/blocks
          attachments: fields/attachments
