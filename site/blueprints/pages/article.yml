title: Article
extends:
  - presets/tabs

tabs:
  content:
    columns:
      - width: 1/3
        fields:
          date:
            label: Date de publication
            width: 3/4
            extends: fields/date

          showDate:
            label: Afficher la date
            type: toggle
            width: 1/4

          categories:
            label: Catégories
            type: multiselect
            options:
              type: query
              query: page.parent.categories.toStructure
              text: "{{ item.title }}"
              value: "{{ item.title.slug }}"


      - width: 2/3
        fields:
          description:
            label: Chapô (optionnel)
            type: writer

          blocks: fields/blocks
          attachments: fields/attachments
