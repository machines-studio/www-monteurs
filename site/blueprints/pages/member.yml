extends: pages/default

tabs:
  content:
    columns:
      left:
        fields:
          showDate: false
          release:
            label: Date de sortie
            extends: fields/date
          categories: false
          token:
            label: Clé de sécurité
            extends: fields/raw
          email: fields/raw
          copyright:
            label: Copyright de l’image
            extends: fields/raw

      right:
        width: 2/3
        fields:
          diffusion:
            extends: fields/raw
            type: textarea

          team:
            label: Équipe
            extends: fields/raw
            type: textarea

          comment:
            label: Commentaire
            extends: fields/raw
            type: textarea

          description:
            extends: fields/header
            default: "Réalisation :<br>Montage :"

          blocks:
            label: Synopsis

