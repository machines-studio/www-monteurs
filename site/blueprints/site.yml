extends: presets/tabs

tabs:
  content:
    columns:
      - width: 2/3
        sections:
          pages: sections/pages

      - width: 1/3
        fields:
          email:
            type: email
            translate: false

          newsletter:
            type: url
            translate: false

          partners:
            label: Partenaires
            type: structure
            fields:
              url:
                required: true
              text:
              image: fields/thumbnail
